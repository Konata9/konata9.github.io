<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Redirecting...</title>
    <meta name="robots" content="noindex">
    <script>
        var newDomain = "https://konata9.cc";
        var currentPath = window.location.pathname;
        var currentSearch = window.location.search;
        var currentHash = window.location.hash;
        
        // 处理可能的 GitHub Pages 路径问题
        // 如果 konata9.cc 的结构与 github.io 完全一致，则直接拼接
        var newUrl = newDomain + currentPath + currentSearch + currentHash;
        
        window.location.href = newUrl;
    </script>
</head>
<body>
    <p>页面未找到。正在尝试跳转至新域名... <a href="https://konata9.cc" id="redirect-link">前往首页</a></p>
    <script>
        // 更新链接地址以便用户手动点击
        var targetUrl = "https://konata9.cc" + window.location.pathname + window.location.search + window.location.hash;
        document.getElementById('redirect-link').href = targetUrl;
        document.getElementById('redirect-link').innerText = targetUrl;
    </script>
</body>
</html>
