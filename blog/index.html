ass="vpi-books icon" data-v-d65e4e5f></span><span data-v-d65e4e5f>约 1378 字</span><span data-v-d65e4e5f>5 分钟</span></div><div class="tag-list" data-v-d65e4e5f><span class="icon vpi-tag" data-v-d65e4e5f></span><!--[--><a class="vp-link link tag vp-tag-cyl2" href="/blog/tags/?tag=写作" data-v-d65e4e5f><!--[-->写作<!--]--></a><a class="vp-link link tag vp-tag-v77q" href="/blog/tags/?tag=程序员" data-v-d65e4e5f><!--[-->程序员<!--]--></a><a class="vp-link link tag vp-tag-u868" href="/blog/tags/?tag=生活感悟" data-v-d65e4e5f><!--[-->生活感悟<!--]--></a><!--]--></div><div class="create-time" data-v-d65e4e5f><span class="icon vpi-clock" data-v-d65e4e5f></span><span data-v-d65e4e5f>2026-01-19</span></div></div><!----></div></div></template><template><div class="vp-post-item" data-allow-mismatch data-v-27972f63 data-v-d65e4e5f><!----><div class="post-item-content" data-v-d65e4e5f><h3 data-v-d65e4e5f><!----><!----><!----><a class="vp-link link" href="/blog/oy3wm3rj/" data-v-d65e4e5f><!--[-->我的 2025：写了 48 期周刊、上线 2 款产品、减重 9 公斤<!--]--></a></h3><div class="post-meta" data-v-d65e4e5f><!----><div class="reading-time" data-v-d65e4e5f><span class="vpi-books icon" data-v-d65e4e5f></span><span data-v-d65e4e5f>约 2175 字</span><span data-v-d65e4e5f>7 分钟</span></div><div class="tag-list" data-v-d65e4e5f><span class="icon vpi-tag" data-v-d65e4e5f></span><!--[--><a class="vp-link link tag vp-tag-ywme" href="/blog/tags/?tag=年度总结" data-v-d65e4e5f><!--[-->年度总结<!--]--></a><a class="vp-link link tag vp-tag-v77q" href="/blog/tags/?tag=程序员" data-v-d65e4e5f><!--[-->程序员<!--]--></a><a class="vp-link link tag vp-tag-c134" href="/blog/tags/?tag=生活" data-v-d65e4e5f><!--[-->生活<!--]--></a><!--]--></div><div class="create-time" data-v-d65e4e5f><span class="icon vpi-clock" data-v-d65e4e5f></span><span data-v-d65e4e5f>2026-01-03</span></div></div><div class="vp-doc excerpt" data-v-d65e4e5f><p>站在 2026 年的起跑线上，回望 2025。</p>
<p>这一年对我而言，是<strong>拥抱变化与重构自我</strong>的一年。我不再仅仅是代码的搬运工，而是借助 AI 在短时间内上线两款产品；不再忽视身体的信号，成功减重 9 公斤找回了健康。当然，还有那 48 篇周刊见证过的每一个脚印……</p>
</div></div></div></template><template><div class="vp-post-item" data-allow-mismatch data-v-27972f63 data-v-d65e4e5f><!----><div class="post-item-content" data-v-d65e4e5f><h3 data-v-d65e4e5f><!----><!----><!----><a class="vp-link link" href="/blog/2twu1aee/" data-v-d65e4e5f><!--[-->2025 终于在 AI 代码助手里找到了“Vibe”<!--]--></a></h3><div class="post-meta" data-v-d65e4e5f><!----><div class="reading-time" data-v-d65e4e5f><span class="vpi-books icon" data-v-d65e4e5f></span><span data-v-d65e4e5f>约 1635 字</span><span data-v-d65e4e5f>5 分钟</span></div><div class="tag-list" data-v-d65e4e5f><span class="icon vpi-tag" data-v-d65e4e5f></span><!--[--><a class="vp-link link tag vp-tag-v77q" href="/blog/tags/?tag=Vibe Coding" data-v-d65e4e5f><!--[-->Vibe Coding<!--]--></a><a class="vp-link link tag vp-tag-c134" href="/blog/tags/?tag=AI" data-v-d65e4e5f><!--[-->AI<!--]--></a><a class="vp-link link tag vp-tag-cqp7" href="/blog/tags/?tag=编程开发" data-v-d65e4e5f><!--[-->编程开发<!--]--></a><!--]--></div><div class="create-time" data-v-d65e4e5f><span class="icon vpi-clock" data-v-d65e4e5f></span><span data-v-d65e4e5f>2026-01-01</span></div></div><div class="vp-doc excerpt" data-v-d65e4e5f><p><img src="https://raw.githubusercontent.com/Konata9/pic-base/main/pics/20260101141726394.png" alt=""></p>
<p>2025 年了，Vibe Coding 早已不再是陌生的概念。无论你是否抗拒，AI 都已经像空气一样，无声无息地融入了我们的工作流。</p>
<p>回顾这一年，AI 在我手中完成了一场从“单纯的补全工具”到“全能数字助手”的进化。这不仅改变了我的代码，更彻底重塑了我的工作方式——以及我对“写代码”这件事的理解。</p>
</div></div></div></template><template><div class="vp-post-item" data-allow-mismatch data-v-27972f63 data-v-d65e4e5f><!----><div class="post-item-content" data-v-d65e4e5f><h3 data-v-d65e4e5f><!----><!----><!----><a class="vp-link link" href="/article/d69bfr3g/" data-v-d65e4e5f><!--[-->给爱唱歌的大人的玩具：Musspark AI 随弹吉他 S1 mini —— 三个月使用体验<!--]--></a></h3><div class="post-meta" data-v-d65e4e5f><!----><div class="reading-time" data-v-d65e4e5f><span class="vpi-books icon" data-v-d65e4e5f></span><span data-v-d65e4e5f>约 2088 字</span><span data-v-d65e4e5f>7 分钟</span></div><div class="tag-list" data-v-d65e4e5f><span class="icon vpi-tag" data-v-d65e4e5f></span><!--[--><a class="vp-link link tag vp-tag-2ytb" href="/blog/tags/?tag=好物分享" data-v-d65e4e5f><!--[-->好物分享<!--]--></a><a class="vp-link link tag vp-tag-c134" href="/blog/tags/?tag=生活" data-v-d65e4e5f><!--[-->生活<!--]--></a><a class="vp-link link tag vp-tag-1pgy" href="/blog/tags/?tag=音乐" data-v-d65e4e5f><!--[-->音乐<!--]--></a><a class="vp-link link tag vp-tag-1pgy" href="/blog/tags/?tag=兴趣" data-v-d65e4e5f><!--[-->兴趣<!--]--></a><!--]--></div><div class="create-time" data-v-d65e4e5f><span class="icon vpi-clock" data-v-d65e4e5f></span><span data-v-d65e4e5f>2025-12-21</span></div></div><div class="vp-doc excerpt" data-v-d65e4e5f><blockquote>
<p>事前声明：本文中的 Musspark AI 随弹吉他 S1 mini 是自费购买，无任何利益相关。全文只是出自一个喜欢这个产品的中年人的主观体验。</p>
</blockquote>
<ul>
<li>购入平台：天猫 musspark 旗舰店</li>
<li>购入时间：2025 / 9 / 10</li>
<li>购入价格：1209（店铺优惠 + 官方立减 + 平台限时补贴 + 淘金币抵扣 + 红包 后的价格）</li>
</ul>
<p><img src="https://raw.githubusercontent.com/Konata9/pic-base/main/pics/20251221223027215.jpg" alt=""></p>

<p>自学生时代起，唱歌就是我的爱好之一。放学回家后浴室中传出的歌声，是我妈判断我今天心情的标准。当时就在想，要是再会点乐器那就更好了。但由于学业紧张，学乐器这件事就搁置了下来。</p>
<p>后面从日本工作回来后，有了空闲时间也到父母催婚的年纪。便想着学个吉他作为追女孩的加分项。脑袋一热下单后，在磕磕绊绊学会了小星星之后，由于手太小无奈倒在了和弦的大门前。</p>
</div></div></div></template><template><div class="vp-post-item" data-allow-mismatch data-v-27972f63 data-v-d65e4e5f><!----><div class="post-item-content" data-v-d65e4e5f><h3 data-v-d65e4e5f><!----><!----><!----><a class="vp-link link" href="/article/u52pwn87/" data-v-d65e4e5f><!--[-->亲历外企裁员：上午还在写代码，下午工位就空了<!--]--></a></h3><div class="post-meta" data-v-d65e4e5f><!----><div class="reading-time" data-v-d65e4e5f><span class="vpi-books icon" data-v-d65e4e5f></span><span data-v-d65e4e5f>约 1405 字</span><span data-v-d65e4e5f>5 分钟</span></div><div class="tag-list" data-v-d65e4e5f><span class="icon vpi-tag" data-v-d65e4e5f></span><!--[--><a class="vp-link link tag vp-tag-v77q" href="/blog/tags/?tag=程序员" data-v-d65e4e5f><!--[-->程序员<!--]--></a><a class="vp-link link tag vp-tag-8xid" href="/blog/tags/?tag=工作" data-v-d65e4e5f><!--[-->工作<!--]--></a><a class="vp-link link tag vp-tag-1ygz" href="/blog/tags/?tag=裁员" data-v-d65e4e5f><!--[-->裁员<!--]--></a><!--]--></div><div class="create-time" data-v-d65e4e5f><span class="icon vpi-clock" data-v-d65e4e5f></span><span data-v-d65e4e5f>2025-12-09</span></div></div><div class="vp-doc excerpt" data-v-d65e4e5f><!-- 插图位置 1：文章开头 -->
<!-- 即梦提示词：极简主义风格插画，现代办公室内部，冷色调，蓝色和灰色为主，空荡荡的工位，几台亮着的显示器，窗外是阴沉的天空，光影对比强烈，氛围压抑且安静，高质量，8k 分辨率 -->
<p><img src="https://raw.githubusercontent.com/Konata9/pic-base/main/pics/20251209233904659.png" alt=""></p>

<p>记得 2018 年的时候，年轻与互联网的兴起，只要简历挂在求职 APP 上，立马就会有猎头或者 HR 来联系。在那时，离职通常伴随着的是薪资增长和职级的跃升。</p>
<p>那时候的我们，仿佛是在草原上逐水草而居的游牧民族，哪里水草丰美就去哪里，从未想过草原也会有枯黄的一天。</p>
<p>然而今天，我第一次以旁观者的身份，见证了一场并非出于自愿的离别。当大环境不再安定、当时代的红利退潮，裸泳的不仅是企业，还有每一个身处其中的个体。</p>
</div></div></div></template><template><div class="vp-post-item" data-allow-mismatch data-v-27972f63 data-v-d65e4e5f><!----><div class="post-item-content" data-v-d65e4e5f><h3 data-v-d65e4e5f><!----><!----><!----><a class="vp-link link" href="/article/sbe2h199/" data-v-d65e4e5f><!--[-->一行代码的“法律陷阱”：开发者必须了解的开源许可证知识<!--]--></a></h3><div class="post-meta" data-v-d65e4e5f><!----><div class="reading-time" data-v-d65e4e5f><span class="vpi-books icon" data-v-d65e4e5f></span><span data-v-d65e4e5f>约 3317 字</span><span data-v-d65e4e5f>11 分钟</span></div><div class="tag-list" data-v-d65e4e5f><span class="icon vpi-tag" data-v-d65e4e5f></span><!--[--><a class="vp-link link tag vp-tag-v77q" href="/blog/tags/?tag=软件开发" data-v-d65e4e5f><!--[-->软件开发<!--]--></a><a class="vp-link link tag vp-tag-heor" href="/blog/tags/?tag=开源许可证" data-v-d65e4e5f><!--[-->开源许可证<!--]--></a><!--]--></div><div class="create-time" data-v-d65e4e5f><span class="icon vpi-clock" data-v-d65e4e5f></span><span data-v-d65e4e5f>2025-11-08</span></div></div><div class="vp-doc excerpt" data-v-d65e4e5f><p>事情是这样的：我之前在开发一个 PGP 加密的功能。在 Node.js 生态中寻觅了一番后，我找到了一个近乎完美的库——<code v-pre>openpgp.js</code>。它的 Star 数很高，社区活跃，文档齐全，API 设计也相当优雅，完美契合我的需求。</p>
<p>但当我整理好设计方案并向团队介绍我找到的这个“神器”时，我的老大提出了一个关键的问题：</p>
<p>“这个库用的是什么开源许可证？”</p>
<p>我心里咯噔一下，因为我知道公司对开源许可证有严格的要求。但 <code v-pre>openpgp.js</code> 用的是 LGPL 许可证，在项目中也只是引用。因此我并没觉得这是个大问题。</p>
<p>于是我回答道：“是 LGPL，但我们只是在项目中引用。怎么了？”</p>
<p>老大的回复很坚决：“不行，LGPL 有风险，我们不能在商业闭源项目中使用。你得换一个库。”</p>
<p>预料中的结果还是发生了。一个功能强大、社区活跃的库，就因为一个“许可证”被拒之门外了。因为对于商业项目来说，法律的合规性远比功能来得更重要。</p>
<p>而“开源软件许可证”这个日常与我们开发者打交道、却常常忽略的小事，背后可能隐藏着巨大的法律风险。</p>
<p>所以，我想把我的这段经历和学习心得整理出来，变成一篇极简指南。希望它能帮助你，在选择依赖库时不会陷入法律困境。</p>

</div></div></div></template><template><div class="vp-post-item" data-allow-mismatch data-v-27972f63 data-v-d65e4e5f><!----><div class="post-item-content" data-v-d65e4e5f><h3 data-v-d65e4e5f><!----><!----><!----><a class="vp-link link" href="/article/hfy7ftph/" data-v-d65e4e5f><!--[-->福州小记流水账<!--]--></a></h3><div class="post-meta" data-v-d65e4e5f><!----><div class="reading-time" data-v-d65e4e5f><span class="vpi-books icon" data-v-d65e4e5f></span><span data-v-d65e4e5f>约 1136 字</span><span data-v-d65e4e5f>4 分钟</span></div><div class="tag-list" data-v-d65e4e5f><span class="icon vpi-tag" data-v-d65e4e5f></span><!--[--><a class="vp-link link tag vp-tag-c134" href="/blog/tags/?tag=生活" data-v-d65e4e5f><!--[-->生活<!--]--></a><a class="vp-link link tag vp-tag-1pgy" href="/blog/tags/?tag=旅行" data-v-d65e4e5f><!--[-->旅行<!--]--></a><!--]--></div><div class="create-time" data-v-d65e4e5f><span class="icon vpi-clock" data-v-d65e4e5f></span><span data-v-d65e4e5f>2025-10-27</span></div></div><div class="vp-doc excerpt" data-v-d65e4e5f><p>这周的周刊稍微提了一下福州的旅行，回家整理相册发现一些有意思的照片。一般旅行我都是扮演“尸体”的角色，只要吃好喝好行。所以这篇并不是攻略，只是趁着记忆还温热时的流水账。</p>
<p>（感谢 37丫37 老师的“好拼”，免费又好用。）</p>

<p>我们是晚上落地长乐，所以第二天的第一站便是附近的显应宫。显应宫的大门非常大在路边，但进去需要要往里走一段。</p>
<p>显应宫分为地上和地下两部分，可以买联票。点评上会比线下稍微便宜一些。</p>
<p>工作日人不多，所以显得非常清净。地上部分应该是后面造的，让人供奉香火。地下部分是当年挖掘的现场，不能拍照。但可以看到原件也是值回票价了。</p>
<p>显应宫是少数同时供奉郑和与妈祖的寺庙。当年（九几年）挖掘时还有很多蝴蝶、昆虫也来凑趣，停在石像上。原以为又是什么故事，直到看到照片资料，不得不感叹真是神奇。</p>
<p><img src="https://raw.githubusercontent.com/Konata9/pic-base/main/pics/202510272320743.jpg" alt=""></p>
</div></div></div></template><template><div class="vp-post-item" data-allow-mismatch data-v-27972f63 data-v-d65e4e5f><!----><div class="post-item-content" data-v-d65e4e5f><h3 data-v-d65e4e5f><!----><!----><!----><a class="vp-link link" href="/article/f0ltn2jl/" data-v-d65e4e5f><!--[-->我的两次 Vibe Coding 经历，一次天堂，一次地狱<!--]--></a></h3><div class="post-meta" data-v-d65e4e5f><!----><div class="reading-time" data-v-d65e4e5f><span class="vpi-books icon" data-v-d65e4e5f></span><span data-v-d65e4e5f>约 2082 字</span><span data-v-d65e4e5f>7 分钟</span></div><div class="tag-list" data-v-d65e4e5f><span class="icon vpi-tag" data-v-d65e4e5f></span><!--[--><a class="vp-link link tag vp-tag-v77q" href="/blog/tags/?tag=Vibe Coding" data-v-d65e4e5f><!--[-->Vibe Coding<!--]--></a><a class="vp-link link tag vp-tag-cyl2" href="/blog/tags/?tag=AI 编码" data-v-d65e4e5f><!--[-->AI 编码<!--]--></a><a class="vp-link link tag vp-tag-cqp7" href="/blog/tags/?tag=编程开发" data-v-d65e4e5f><!--[-->编程开发<!--]--></a><!--]--></div><div class="create-time" data-v-d65e4e5f><span class="icon vpi-clock" data-v-d65e4e5f></span><span data-v-d65e4e5f>2025-10-08</span></div></div><div class="vp-doc excerpt" data-v-d65e4e5f><p>Vibe Coding 对开发者来说已经不再陌生，都说能让我们效率翻倍，但它真的能让我们在任何技术领域都所向披靡吗？最近，我在两个截然不同的项目中，分别体验了一周“天堂”和“地狱”般的 AI 编程，得出了一个可能让你有些意外的结论。</p>
</div></div></div></template><template><div class="vp-post-item" data-allow-mismatch data-v-27972f63 data-v-d65e4e5f><!----><div class="post-item-content" data-v-d65e4e5f><h3 data-v-d65e4e5f><!----><!----><!----><a class="vp-link link" href="/article/q0kuswk4/" data-v-d65e4e5f><!--[-->谁动了我的数据？一个 Bug 背后的“一行代码”真凶<!--]--></a></h3><div class="post-meta" data-v-d65e4e5f><!----><div class="reading-time" data-v-d65e4e5f><span class="vpi-books icon" data-v-d65e4e5f></span><span data-v-d65e4e5f>约 2179 字</span><span data-v-d65e4e5f>7 分钟</span></div><div class="tag-list" data-v-d65e4e5f><span class="icon vpi-tag" data-v-d65e4e5f></span><!--[--><a class="vp-link link tag vp-tag-v77q" href="/blog/tags/?tag=程序员" data-v-d65e4e5f><!--[-->程序员<!--]--></a><a class="vp-link link tag vp-tag-cyl2" href="/blog/tags/?tag=开发" data-v-d65e4e5f><!--[-->开发<!--]--></a><a class="vp-link link tag vp-tag-u868" href="/blog/tags/?tag=Bug" data-v-d65e4e5f><!--[-->Bug<!--]--></a><a class="vp-link link tag vp-tag-qe87" href="/blog/tags/?tag=JavaScript" data-v-d65e4e5f><!--[-->JavaScript<!--]--></a><!--]--></div><div class="create-time" data-v-d65e4e5f><span class="icon vpi-clock" data-v-d65e4e5f></span><span data-v-d65e4e5f>2025-09-24</span></div></div><div class="vp-doc excerpt" data-v-d65e4e5f><p><strong>引子：风平浪静下的暗流涌动</strong></p>
<p>一个再普通不过的周五下午，午后的阳光透过玻璃洒落进来。键盘敲击声此起彼伏，一切都显得那么平静而有序。我正沉浸在代码的世界里，憧憬着周末的到来。然而，就在这时，Slack 上突然弹出一条同事消息：</p>
<p>“Hi，最近有动过 xxx 表的数据吗？自动化 case 挂了两个。”。</p>
<p>自动化测试是我们的“第一道防线”，一旦报警，往往意味着生产环境可能也存在隐患。更要命的是，下周的发布负责人，正是我自己。</p>
<p>但事已至此，先过周末吧。说不定欧洲同事会有回复呢？毕竟喜欢“自由”的他们可有不少直接跑脚本的“前科”。</p>
<p><img src="https://raw.githubusercontent.com/Konata9/pic-base/main/pics/202510071549352.png" alt=""></p>
</div></div></div></template><template><div class="vp-post-item" data-allow-mismatch data-v-27972f63 data-v-d65e4e5f><!----><div class="post-item-content" data-v-d65e4e5f><h3 data-v-d65e4e5f><!----><!----><!----><a class="vp-link link" href="/article/awhl9g7l/" data-v-d65e4e5f><!--[-->数字游民的田园牧歌与残酷现实：来自计家墩的一日观察<!--]--></a></h3><div class="post-meta" data-v-d65e4e5f><!----><div class="reading-time" data-v-d65e4e5f><span class="vpi-books icon" data-v-d65e4e5f></span><span data-v-d65e4e5f>约 2434 字</span><span data-v-d65e4e5f>8 分钟</span></div><div class="tag-list" data-v-d65e4e5f><span class="icon vpi-tag" data-v-d65e4e5f></span><!--[--><a class="vp-link link tag vp-tag-c134" href="/blog/tags/?tag=数字游民" data-v-d65e4e5f><!--[-->数字游民<!--]--></a><a class="vp-link link tag vp-tag-sx93" href="/blog/tags/?tag=思考" data-v-d65e4e5f><!--[-->思考<!--]--></a><a class="vp-link link tag vp-tag-8xid" href="/blog/tags/?tag=工作" data-v-d65e4e5f><!--[-->工作<!--]--></a><a class="vp-link link tag vp-tag-c134" href="/blog/tags/?tag=生活" data-v-d65e4e5f><!--[-->生活<!--]--></a><!--]--></div><div class="create-time" data-v-d65e4e5f><span class="icon vpi-clock" data-v-d65e4e5f></span><span data-v-d65e4e5f>2025-09-14</span></div></div><div class="vp-doc excerpt" data-v-d65e4e5f>
<p>上周，老婆突然分享了一条稻草人新开的线路：数字游民生活初体验。去探访坐落在昆山的计家墩、理想村里数字游民社区。</p>
<p>一名程序员，很早就对远程工作有所了解，也读到过网上那些成功的独立开发者的事迹。他们或是在沙滩海边或者在山野林间，打开笔记本配着咖啡工作。没有 KPI 的压力、没有 996 的疲劳更没有 35 岁的优化，有的事可以平衡工作和生活的权力以及自由的状态。这便是我脑海中，关于数字游民的那层玫瑰色的滤镜。</p>
<p>我带着这份混杂着好奇与向往的滤镜，果断地让老婆报名。然后踏上了前往计家墩的旅程，想要亲眼看看那“理想中”的生活。</p>
</div></div></div></template><template><div class="vp-post-item" data-allow-mismatch data-v-27972f63 data-v-d65e4e5f><!----><div class="post-item-content" data-v-d65e4e5f><h3 data-v-d65e4e5f><!----><!----><!----><a class="vp-link link" href="/article/0yx6lnd0/" data-v-d65e4e5f><!--[-->AWS IoT Core 成本优化实战：从 PoC 到生产的省钱之旅<!--]--></a></h3><div class="post-meta" data-v-d65e4e5f><!----><div class="reading-time" data-v-d65e4e5f><span class="vpi-books icon" data-v-d65e4e5f></span><span data-v-d65e4e5f>约 3530 字</span><span data-v-d65e4e5f>12 分钟</span></div><div class="tag-list" data-v-d65e4e5f><span class="icon vpi-tag" data-v-d65e4e5f></span><!--[--><a class="vp-link link tag vp-tag-p8yr" href="/blog/tags/?tag=AWS" data-v-d65e4e5f><!--[-->AWS<!--]--></a><a class="vp-link link tag vp-tag-1pgy" href="/blog/tags/?tag=IoT Core" data-v-d65e4e5f><!--[-->IoT Core<!--]--></a><a class="vp-link link tag vp-tag-c134" href="/blog/tags/?tag=MQTT" data-v-d65e4e5f><!--[-->MQTT<!--]--></a><a class="vp-link link tag vp-tag-sx93" href="/blog/tags/?tag=成本优化" data-v-d65e4e5f><!--[-->成本优化<!--]--></a><!--]--></div><div class="create-time" data-v-d65e4e5f><span class="icon vpi-clock" data-v-d65e4e5f></span><span data-v-d65e4e5f>2025-09-12</span></div></div><div class="vp-doc excerpt" data-v-d65e4e5f><p>在上一篇<VPLink href="/article/bbcqgo9g/">《从 HTTP 轮询到 MQTT》</VPLink>中，我们成功搭建了一个基于 AWS IoT Core 的 PoC 架构，验证了 MQTT 通信的可行性。但那只是万里长征的第一步。一个“能用”的 PoC 和一个“好用”的生产环境之间，还隔着网络安全、全球访问延迟、以及最重要的——成本的鸿沟。</p>
<p>这篇文章，我们就来一起走完这‘最后一公里’。我们将把 PoC 架构一步步演进为稳健的生产级架构，并深入探讨在功能日益强大的同时，如何精打细算，将每一分钱都花在刀刃上，实现功能与成本的双赢。</p>
</div></div></div></template><template><div class="vp-post-item" data-allow-mismatch data-v-27972f63 data-v-d65e4e5f><!----><div class="post-item-content" data-v-d65e4e5f><h3 data-v-d65e4e5f><!----><!----><!----><a class="vp-link link" href="/article/wuwngb33/" data-v-d65e4e5f><!--[-->人生最好的架构，是为自己而设计<!--]--></a></h3><div class="post-meta" data-v-d65e4e5f><!----><div class="reading-time" data-v-d65e4e5f><span class="vpi-books icon" data-v-d65e4e5f></span><span data-v-d65e4e5f>约 2966 字</span><span data-v-d65e4e5f>10 分钟</span></div><div class="tag-list" data-v-d65e4e5f><span class="icon vpi-tag" data-v-d65e4e5f></span><!--[--><a class="vp-link link tag vp-tag-p8yr" href="/blog/tags/?tag=人生" data-v-d65e4e5f><!--[-->人生<!--]--></a><a class="vp-link link tag vp-tag-c134" href="/blog/tags/?tag=架构" data-v-d65e4e5f><!--[-->架构<!--]--></a><a class="vp-link link tag vp-tag-sx93" href="/blog/tags/?tag=思考" data-v-d65e4e5f><!--[-->思考<!--]--></a><!--]--></div><div class="create-time" data-v-d65e4e5f><span class="icon vpi-clock" data-v-d65e4e5f></span><span data-v-d65e4e5f>2025-09-06</span></div></div><div class="vp-doc excerpt" data-v-d65e4e5f><blockquote>
<p>某个深夜，在完成一次的码重构后，我靠在椅子上，忽然有了一个想法：我们如此痴迷于为软件寻找最佳架构，那我们的人生呢？我们是否也应该成为自己人生的首席架构师？这个想法最终促成了这篇文章，希望能与每一个在世界里探索的你，共同思考。</p>
</blockquote>
<p>作为一名开发者，我们常常痴迷于寻找“最好的架构”。是微服务，还是单体？是事件驱动，还是分层设计？我们争论不休，试图在项目启动之初，就绘制一张完美的蓝图，一劳永逸。</p>
<p>但或许，我们早已在无数次深夜的重构中领悟：<strong>最好的架构，不存在于图纸上，而存在于一次次的迭代、试错和优化之中。</strong></p>
<p>这像极了我们的人生。</p>
<!-- 插图：温暖绘本风格 一个女孩坐在一棵由代码和电路组成的生命之树下，仰望星空 4:3 -->
<p><img src="https://raw.githubusercontent.com/Konata9/pic-base/main/pics/girl-look-at-star.png" alt=""></p>
</div></div></div></template><template><div class="vp-post-item" data-allow-mismatch data-v-27972f63 data-v-d65e4e5f><!----><div class="post-item-content" data-v-d65e4e5f><h3 data-v-d65e4e5f><!----><!----><!----><a class="vp-link link" href="/article/bbcqgo9g/" data-v-d65e4e5f><!--[-->从 HTTP 轮询到 MQTT：我们在 AWS IoT Core 上的架构演进与实战复盘<!--]--></a></h3><div class="post-meta" data-v-d65e4e5f><!----><div class="reading-time" data-v-d65e4e5f><span class="vpi-books icon" data-v-d65e4e5f></span><span data-v-d65e4e5f>约 3622 字</span><span data-v-d65e4e5f>12 分钟</span></div><div class="tag-list" data-v-d65e4e5f><span class="icon vpi-tag" data-v-d65e4e5f></span><!--[--><a class="vp-link link tag vp-tag-p8yr" href="/blog/tags/?tag=AWS" data-v-d65e4e5f><!--[-->AWS<!--]--></a><a class="vp-link link tag vp-tag-1pgy" href="/blog/tags/?tag=IoT Core" data-v-d65e4e5f><!--[-->IoT Core<!--]--></a><a class="vp-link link tag vp-tag-c134" href="/blog/tags/?tag=MQTT" data-v-d65e4e5f><!--[-->MQTT<!--]--></a><!--]--></div><div class="create-time" data-v-d65e4e5f><span class="icon vpi-clock" data-v-d65e4e5f></span><span data-v-d65e4e5f>2025-08-16</span></div></div><div class="vp-doc excerpt" data-v-d65e4e5f><p>在之前的物联网项目中，由于历史原因，我们的设备通过 HTTP 轮询的方式与服务端交互，这套机制在项目初期看似简单直接，但随着业务量的增长，问题也逐渐暴露出来。</p>
<p><img src="https://raw.githubusercontent.com/Konata9/pic-base/main/pics/http-request-model.png" alt="HTTP 轮询模式"></p>
<p>这种模式的痛点非常具体：</p>
<ol>
<li><strong>电量焦虑</strong>：对于电池供电的设备，频繁的轮询请求就像一个无底洞，快速榨干设备的电量，大大缩短了续航时间。</li>
<li><strong>消息延迟与丢失</strong>：服务端无法主动向设备推送消息。更糟糕的是，如果服务器进行一次版本发布，哪怕只有短短几十秒，也会导致大量的设备消息丢失，这在很多场景下是不可接受的。</li>
<li><strong>扩展性瓶颈</strong>：为了维持状态，服务器被迫设计成“有状态”的，这为水平扩展带来了巨大的麻烦，每次扩容都如履薄冰。</li>
</ol>
<p>痛定思痛，我们意识到必须寻找一种更现代、更高效的通信方案。团队需要的是一套无状态、易拓展、支持双向通信的架构。经过一番调研和技术选型，MQTT 协议进入了我们的视野。考虑到公司所有基础设施都在 AWS 上，我们自然而然地将目光投向了 AWS IoT Core。</p>
<p>本文将完整复盘我们团队是如何从零开始，基于 AWS IoT Core 构建 MQTT 通信体系的全过程，分享其中的架构设计思考、关键决策和一些“踩过才知道”的实践心得。</p>
<blockquote>
<p>注：本文基于 AWS 架构，需要您对 AWS 服务有基本的了解。对于 AWS 官方文档已有的详细步骤，本文将不再赘述，而是聚焦于架构设计和经验分享。</p>
</blockquote>
